<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Plus — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#121316;
    --surface:#1c1e23;
    --surface-2:#24272d;
    --line:#2f333b;
    --text:#f4f4f2;
    --text-dim:#8b8f98;
    --accent:#ff5a1f;
    --good:#3ddc84;
    --bad:#ff4757;
    --warn:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---- Login gate ---- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    padding:20px;
  }
  #gate .brand{font-family:'Bebas Neue',sans-serif; font-size:40px; letter-spacing:1.5px;}
  #gate .brand span{color:var(--accent);}
  #gate input{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:15px;
    width:260px;
    font-family:'Inter',sans-serif;
  }
  #gate button{
    background:var(--accent);
    color:#1a0d05;
    border:none;
    padding:13px 20px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
    width:260px;
    font-family:'Inter',sans-serif;
  }
  #gate .err{color:var(--bad); font-size:13px; height:16px;}

  /* ---- Main app ---- */
  #app{display:none;}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .brand{font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1.5px;}
  .brand span{color:var(--accent);}

  main{max-width:1000px; margin:0 auto; padding:24px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
  }
  .stat .n{font-family:'Bebas Neue',sans-serif; font-size:34px;}
  .stat .l{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.6px;}
  .stat.good .n{color:var(--good);}
  .stat.bad .n{color:var(--bad);}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    margin-bottom:24px;
  }
  .panel h2{font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.8px; margin-bottom:16px;}

  .form-row{display:grid; grid-template-columns:2fr 1.4fr 1.2fr auto; gap:10px; align-items:end;}
  .field label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 12px;
    border-radius:9px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .btn{
    background:var(--accent);
    color:#1a0d05;
    border:none;
    padding:12px 18px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-weight:600;
    padding:8px 12px;
    font-size:13px;
  }
  .btn.ghost:hover{border-color:var(--accent);}
  .btn.small{padding:7px 11px; font-size:12px; border-radius:7px;}

  input#search{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 14px;
    border-radius:9px;
    font-size:14px;
    margin-bottom:14px;
    font-family:'Inter',sans-serif;
  }

  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-dim);
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  td{padding:12px 10px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .badge.active{background:#132a1f; color:var(--good);}
  .badge.expired{background:#2c151a; color:var(--bad);}
  .row-actions{display:flex; gap:6px;}
  .muted{color:var(--text-dim); font-size:12px;}

  /* ---- QR modal ---- */
  .modal-bg{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    align-items:center; justify-content:center;
    z-index:20;
    padding:20px;
  }
  .modal-bg.show{display:flex;}
  .card{
    background:#fff;
    color:#111;
    border-radius:18px;
    width:320px;
    padding:26px;
    text-align:center;
  }
  .card .gymname{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:#ff5a1f; margin-bottom:2px;}
  .card .membername{font-size:16px; font-weight:800; margin:10px 0 2px;}
  .card .plan{font-size:12px; color:#777; margin-bottom:14px;}
  #qrcanvas{display:flex; justify-content:center; margin-bottom:10px;}
  .card .shortcode{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:4px;
    color:#111;
    background:#f2f2f2;
    border-radius:8px;
    padding:6px 0;
    margin-bottom:16px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions button{flex:1; font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate">
  <div class="brand">IRON<span>PLUS</span> ADMIN</div>
  <input type="password" id="pw" placeholder="Admin password" onkeydown="if(event.key==='Enter')tryLogin()">
  <button class="btn" onclick="tryLogin()">Enter</button>
  <div class="err" id="pwErr"></div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="brand">IRON<span>PLUS</span> ADMIN</div>
    <button class="btn ghost" onclick="location.reload()">Log out</button>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">—</div><div class="l">Total members</div></div>
      <div class="stat good"><div class="n" id="statActive">—</div><div class="l">Active</div></div>
      <div class="stat bad"><div class="n" id="statExpired">—</div><div class="l">Expired</div></div>
    </div>

    <div class="panel">
      <h2>Register new member</h2>
      <div class="form-row">
        <div class="field"><label>Full name</label><input id="newName" placeholder="e.g. Abel Tesfaye"></div>
        <div class="field"><label>Phone</label><input id="newPhone" placeholder="09xx xxx xxx"></div>
        <div class="field">
          <label>Plan</label>
          <select id="newPlan">
            <option value="1_month">1 Month</option>
            <option value="3_month">3 Months</option>
            <option value="6_month">6 Months</option>
            <option value="12_month">12 Months</option>
          </select>
        </div>
        <button class="btn" onclick="registerMember()">+ Add member</button>
      </div>
    </div>

    <div class="panel">
      <h2>Members</h2>
      <input id="search" placeholder="Search by name or phone…" oninput="renderTable()">
      <table>
        <thead>
          <tr><th>Name</th><th>Code</th><th>Plan</th><th>Expires</th><th>Status</th><th>Card</th></tr>
        </thead>
        <tbody id="memberRows">
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- QR MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="card">
    <div class="gymname">IRON PLUS</div>
    <div class="membername" id="modalName"></div>
    <div class="plan" id="modalPlan"></div>
    <div id="qrcanvas"></div>
    <div class="shortcode" id="modalCode"></div>
    <div class="modal-actions">
      <button class="btn ghost small" onclick="closeModal()">Close</button>
      <button class="btn small" onclick="window.print()">Print card</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://wbidkbjxacyzughznxsi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2w2ORU15ZsORCVMuEX3cWw_VCuhp39Y";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // sha256("ironplus2026")
  const PW_HASH = "114d1ba94f57ab266f03dacc75d8698ecdfa0800e404adbc82ea93bec0db58a6";

  async function sha256(msg){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function tryLogin(){
    const pw = document.getElementById('pw').value;
    const hash = await sha256(pw);
    if(hash === PW_HASH){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadMembers();
    } else {
      document.getElementById('pwErr').textContent = 'Wrong password';
    }
  }

  // No 0/O/1/I to avoid confusion when handwritten or read aloud at the desk
  const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  function genShortCode(){
    let code = '';
    for(let i=0;i<6;i++) code += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)];
    return code;
  }

  const planDays = { '1_month':30, '3_month':90, '6_month':180, '12_month':365 };
  const planLabel = { '1_month':'1 Month', '3_month':'3 Months', '6_month':'6 Months', '12_month':'12 Months' };

  let allMembers = [];

  async function loadMembers(){
    const { data, error } = await sb.from('members').select('*').order('created_at', { ascending:false });
    if(error){ document.getElementById('memberRows').innerHTML = `<tr><td colspan="5" class="muted">Error loading members.</td></tr>`; return; }
    allMembers = data;
    renderTable();
    renderStats();
  }

  function isActive(m){
    const today = new Date(); today.setHours(0,0,0,0);
    return m.status === 'active' && new Date(m.end_date) >= today;
  }

  function renderStats(){
    const total = allMembers.length;
    const active = allMembers.filter(isActive).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statExpired').textContent = total - active;
  }

  function renderTable(){
    const q = document.getElementById('search').value.toLowerCase();
    const rows = allMembers.filter(m =>
      m.full_name.toLowerCase().includes(q) || (m.phone||'').toLowerCase().includes(q)
    );
    const tbody = document.getElementById('memberRows');
    if(!rows.length){
      tbody.innerHTML = `<tr><td colspan="5" class="muted">No members found.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(m => {
      const active = isActive(m);
      return `
        <tr>
          <td><b>${escapeHtml(m.full_name)}</b><br><span class="muted">${escapeHtml(m.phone||'—')}</span></td>
          <td style="font-family:'Bebas Neue',sans-serif; letter-spacing:1.5px; font-size:15px;">${m.short_code || '—'}</td>
          <td>${planLabel[m.plan] || m.plan}</td>
          <td>${m.end_date}</td>
          <td><span class="badge ${active ? 'active' : 'expired'}">${active ? 'Active' : 'Expired'}</span></td>
          <td class="row-actions">
            <button class="btn ghost small" onclick="openModal('${m.id}')">QR card</button>
            <button class="btn ghost small" onclick="renewMember('${m.id}')">Renew</button>
          </td>
        </tr>`;
    }).join('');
  }

  async function registerMember(){
    const name = document.getElementById('newName').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const plan = document.getElementById('newPlan').value;
    if(!name){ alert('Enter the member\\'s name.'); return; }

    const start = new Date();
    const end = new Date(start);
    end.setDate(end.getDate() + planDays[plan]);

    let data, error;
    for(let attempt=0; attempt<5; attempt++){
      const res = await sb.from('members').insert({
        full_name: name,
        phone: phone || null,
        plan: plan,
        start_date: start.toISOString().slice(0,10),
        end_date: end.toISOString().slice(0,10),
        status: 'active',
        short_code: genShortCode()
      }).select().single();
      data = res.data; error = res.error;
      if(!error) break;
      if(!error.message?.includes('short_code')) break; // only retry on short_code collisions
    }

    if(error){ alert('Could not add member: ' + error.message); return; }

    document.getElementById('newName').value = '';
    document.getElementById('newPhone').value = '';
    await loadMembers();
    openModal(data.id); // immediately show the QR card to print
  }

  async function renewMember(id){
    const m = allMembers.find(x => x.id === id);
    if(!m) return;
    const plan = prompt(`Renew ${m.full_name} — enter plan (1_month, 3_month, 6_month, 12_month):`, m.plan);
    if(!plan || !planDays[plan]) return;

    const base = isActive(m) ? new Date(m.end_date) : new Date(); // extend from current end date if still active
    base.setDate(base.getDate() + planDays[plan]);

    const { error } = await sb.from('members').update({
      plan: plan,
      end_date: base.toISOString().slice(0,10),
      status: 'active'
    }).eq('id', id);

    if(error){ alert('Could not renew: ' + error.message); return; }
    await loadMembers();
  }

  function openModal(id){
    const m = allMembers.find(x => x.id === id);
    if(!m) return;
    document.getElementById('modalName').textContent = m.full_name;
    document.getElementById('modalPlan').textContent = `${planLabel[m.plan]} · expires ${m.end_date}`;
    document.getElementById('modalCode').textContent = m.short_code || '— no code, re-save member —';

    const box = document.getElementById('qrcanvas');
    box.innerHTML = '';
    // Encode a checkin URL with the member id as a query param.
    // Replace CHECKIN_BASE_URL with your hosted checkin.html URL once deployed.
    const CHECKIN_BASE_URL = 'checkin.html';
    new QRCode(box, {
      text: `${CHECKIN_BASE_URL}?id=${m.id}`,
      width: 200, height: 200,
      colorDark: '#111111', colorLight: '#ffffff'
    });

    document.getElementById('modalBg').classList.add('show');
  }
  function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>

</body>
</html>
